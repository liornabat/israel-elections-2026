# Rebuilds the election-day dashboard from the Central Elections Committee JSON.
# A push made with GITHUB_TOKEN does not start the branch-based Pages build, so
# this workflow also deploys with actions/deploy-pages when it runs on main.
# That deploy publishes only after Settings → Pages → Source is "GitHub Actions".
# Hosted runners receive CloudFront HTTP 403 from mapvotes.bechirot.gov.il, so
# the fetch step opens a userspace Cloudflare WARP tunnel when a direct GET fails.
name: Refresh turnout

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-turnout
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test seat allocation
        run: python3 scripts/test_parties.py

      - name: Fetch the committee data and rebuild
        id: refresh
        run: |
          # shellcheck disable=SC1091
          source scripts/ensure_egress.sh
          python3 scripts/refresh.py

      - name: Commit when the source data changed
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/timeline.json data/source_state.json data/schema_manifest.json
          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi
          git commit -F /tmp/commitmsg.txt
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare the Pages artifact
        if: github.ref == 'refs/heads/main' && (steps.refresh.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll _site/

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && (steps.refresh.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/main' && (needs.refresh.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
